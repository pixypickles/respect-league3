<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Futsal Trap Game v16</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="rotateNotice">スマホを横向きにしてください</div>

  <main id="gameWrap">
    <canvas id="game" width="1280" height="720" aria-label="Futsal game"></canvas>

    <div id="hud">
      <div id="score">BLUE 0 - 0 RED</div><div id="versionTag">v16</div>
      <div id="clock">03:00</div>
    </div>

    <div id="stickZone" class="control-zone">
      <div id="stickBase">
        <div id="stickKnob"></div>
      </div>
    </div>

    <div id="buttons" class="control-zone">
      <button id="passBtn" class="game-btn pass">PASS</button>
      <button id="trapBtn" class="game-btn trap">TRAP</button>
      <button id="shootBtn" class="game-btn shoot">SHOT</button>
      <button id="dashBtn" class="game-btn dash">DASH</button>
    </div>

    <div id="message"></div>
    <div id="shotChargeMeter" aria-hidden="true">
      <div id="shotChargeFill"></div>
      <div id="shotChargeText">SHOT</div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
